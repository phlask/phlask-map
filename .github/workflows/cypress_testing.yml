name: Cypress Tests

on: [workflow_call]

jobs:
  cypress_tests:
    runs-on: ubuntu-latest
    env:
      VITE_DB_URL: https://wantycfbnzzocsbthqzs.supabase.co
      VITE_DB_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      VITE_REACT_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_GOOGLE_MAPS_API_KEY }}
      VITE_OPEN_ROUTE_SERVICE_API_KEY: ${{ secrets.OPEN_ROUTE_SERVICE_API_KEY }}
      VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
      VITE_VERIFICATION_PASSWORD: ${{ secrets.VERIFICATION_PASSWORD }}
    strategy:
      matrix:
        include:
          - spec: 'cypress/e2e/desktop/*.cy.ts'
            config_file: 'cypress.config.ts'
            video_path: 'cypress/videos/desktop'
          - spec: 'cypress/e2e/mobile/*.cy.ts'
            config_file: 'cypress.mobile.config.ts'
            video_path: 'cypress/videos/mobile'
    steps:
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: pnpm start:cypress
          browser: chrome
          spec: ${{ matrix.spec }}
          config-file: ${{ matrix.config_file }}
      - name: Upload videos of failed tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: ${{ matrix.video_path }}
          retention-days: 7 # Optional: how long to keep artifacts
